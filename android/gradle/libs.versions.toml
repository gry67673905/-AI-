[versions]
androidGradlePlugin = "8.5.2"
agconnect = "1.9.6.300"
huaweiMaps = "6.15.1.322"
huaweiLocation = "6.15.1.300"
huaweiSite = "6.2.0.301"
huaweiNavi = "6.13.0.300"
huaweiAwareness = "3.1.0.302"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
androidxLifecycle = "2.8.4"
androidxWebkit = "1.11.0"
gson = "2.11.0"
okhttp = "4.12.0"
junit = "4.13.2"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
huawei-agconnect-core = { module = "com.huawei.agconnect:agconnect-core", version.ref = "agconnect" }
huawei-hms-maps = { module = "com.huawei.hms:maps", version.ref = "huaweiMaps" }
huawei-hms-maps-basic = { module = "com.huawei.hms:maps-basic", version.ref = "huaweiMaps" }
huawei-hms-location = { module = "com.huawei.hms:location", version.ref = "huaweiLocation" }
huawei-hms-site = { module = "com.huawei.hms:site", version.ref = "huaweiSite" }
huawei-hms-navi = { module = "com.huawei.hms:navisdk", version.ref = "huaweiNavi" }
huawei-hms-awareness = { module = "com.huawei.hms:awareness", version.ref = "huaweiAwareness" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
huawei-agconnect = { id = "com.huawei.agconnect.agcp", version.ref = "agconnect" }
