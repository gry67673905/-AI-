]
def metaStudioSdkDir = file("src/main/assets/metastudio/sdk")
def metaStudioSdkIntegrity = new File(metaStudioSdkDir, "sdk-integrity.json")
def sha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}
if (!metaStudioSdkIntegrity.isFile()) {
    throw new GradleException("MetaStudio SDK 5.0.6 integrity marker is required")
}
def integrity = new JsonSlurper().parse(metaStudioSdkIntegrity)
def declaredFiles = integrity.files instanceof Map ? integrity.files : [:]
def markerValid = integrity.version == metaStudioSdkVersion
    && integrity.cms_verified == true
    && integrity.archive_sha256 == metaStudioArchiveSha256
    && integrity.cms_sha256 == metaStudioCmsSha256
    && declaredFiles.size() == metaStudioSdkFiles.size()
if (!markerValid) {
    throw new GradleException("MetaStudio SDK 5.0.6 CMS/integrity marker is invalid")
}
metaStudioSdkFiles.each { relativePath, expectedHash ->
    File asset = new File(metaStudioSdkDir, relativePath)
    if (!asset.isFile()
        || declaredFiles[relativePath] != expectedHash
        || sha256(asset) != expectedHash) {
        throw new GradleException("MetaStudio SDK 5.0.6 asset is missing or modified: ${relativePath}")
    }
}
def metaStudioSdkReady = true

android {
