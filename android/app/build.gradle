import groovy.json.JsonSlurper

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.huawei.agconnect)
}

def agcConfigFile = file("agconnect-services.json")
def hmsMapApiKey = ""
if (agcConfigFile.exists()) {
    def agcConfig = new JsonSlurper().parse(agcConfigFile)
    hmsMapApiKey = (agcConfig.client.api_key ?: "")
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
}

def sharedDebugKeystore = file("D:/AndroidDev/keystores/ai-companion-debug.keystore")
def govApiBaseOverride = providers.gradleProperty("govApiBase").orNull
def defaultGovApiBase = "https://123.249.68.176"
def configuredGovApiBase = (govApiBaseOverride ?: defaultGovApiBase).trim().replaceAll('/+$', '')
def configuredGovApiUri
try {
    configuredGovApiUri = new URI(configuredGovApiBase)
} catch (Exception invalidUri) {
    throw new GradleException("govApiBase must be a valid HTTPS origin", invalidUri)
}
if (configuredGovApiUri.scheme != "https"
    || !configuredGovApiUri.host
    || configuredGovApiUri.userInfo
    || configuredGovApiUri.query
    || configuredGovApiUri.fragment
    || !(configuredGovApiUri.path == null || configuredGovApiUri.path.isEmpty())) {
    throw new GradleException("govApiBase must be an HTTPS origin without credentials, path, query, or fragment")
}
def escapedGovApiBase = configuredGovApiBase
    .replace("\\", "\\\\")
    .replace("\"", "\\\"")

android {
    namespace "com.example.aicompanion"
    compileSdk 35

    signingConfigs {
        if (sharedDebugKeystore.exists()) {
            sharedDebug {
                storeFile sharedDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.example.aicompanion"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.2.0-cloud-demo"

        buildConfigField "String", "HMS_MAP_API_KEY", "\"${hmsMapApiKey}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "GOV_API_BASE", "\"${escapedGovApiBase}\""
            if (sharedDebugKeystore.exists()) {
                signingConfig signingConfigs.sharedDebug
            }
        }
        release {
            buildConfigField "String", "GOV_API_BASE", "\"${escapedGovApiBase}\""
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.webkit
    implementation libs.gson
    implementation libs.okhttp
    implementation libs.huawei.agconnect.core
    implementation libs.huawei.hms.maps
    implementation libs.huawei.hms.maps.basic
    implementation libs.huawei.hms.location

    testImplementation libs.junit
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.androidx.arch.core.testing
}

tasks.withType(Test).configureEach {
    useJUnit()
    systemProperty "liveBackendTest", System.getProperty("liveBackendTest", "false")
    systemProperty "liveBackendUrl", System.getProperty("liveBackendUrl", defaultGovApiBase)
}
