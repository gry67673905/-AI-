    compileSdk 35

    signingConfigs {
        if (sharedDebugKeystore.exists()) {
            sharedDebug {
                storeFile sharedDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.example.aicompanion"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.2.0-cloud-demo"

        buildConfigField "String", "HMS_MAP_API_KEY", "\"${hmsMapApiKey}\""
        buildConfigField "String", "METASTUDIO_SDK_VERSION", "\"${metaStudioSdkVersion}\""
        buildConfigField "String", "METASTUDIO_SDK_ARCHIVE_SHA256", "\"${metaStudioArchiveSha256}\""
        buildConfigField "boolean", "METASTUDIO_SDK_READY", "${metaStudioSdkReady}"
    }

    buildTypes {
