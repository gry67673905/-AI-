name: smart-gov-assistant

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_gov}
      POSTGRES_USER: ${POSTGRES_USER:-smart_gov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.ps1 first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_gov} -d ${POSTGRES_DB:-smart_gov}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1 first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.22
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1 first}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
      MINIO_REGION: us-east-1
    volumes:
      - milvus_data:/var/lib/milvus
      - ./infra/milvus-user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 20
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  mock-gov-api:
    build:
      context: ./mock-gov-api
    environment:
      PORT: "8080"
      GOV_API_TOKEN: ${GOV_API_TOKEN:?Run scripts/init-env.ps1 first}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
    environment:
      PORT: "3000"
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?Run scripts/init-env.ps1 first}
      MCP_SESSION_TTL_MS: ${MCP_SESSION_TTL_MS:-900000}
      MCP_MAX_SESSIONS: ${MCP_MAX_SESSIONS:-128}
      GOV_API_BASE_URL: ${GOV_API_BASE_URL:-http://mock-gov-api:8080}
      GOV_API_TOKEN: ${GOV_API_TOKEN:?Run scripts/init-env.ps1 first}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      mock-gov-api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: local
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-gov_knowledge_v2}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1 first}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
      MATERIALS_BUCKET: ${MATERIALS_BUCKET:-smart-gov-materials}
      KNOWLEDGE_BUCKET: ${KNOWLEDGE_BUCKET:-smart-gov-knowledge}
      MAX_MATERIAL_BYTES: ${MAX_MATERIAL_BYTES:-10485760}
      MATERIAL_DOCUMENTS_ENABLED: ${MATERIAL_DOCUMENTS_ENABLED:-true}
      MATERIAL_TEMPLATE_SOURCE_PREFIX: ${MATERIAL_TEMPLATE_SOURCE_PREFIX:-material-templates/v1}
      MATERIAL_TEMPLATE_MANIFEST_PATH: ${MATERIAL_TEMPLATE_MANIFEST_PATH:-resources/material_templates/v1/manifest.json}
      MATERIAL_TEMPLATES_BUCKET: ${MATERIAL_TEMPLATES_BUCKET:-smart-gov-material-templates}
      GENERATED_DOCUMENTS_BUCKET: ${GENERATED_DOCUMENTS_BUCKET:-smart-gov-generated-documents}
      MATERIAL_DOCUMENT_RETENTION_HOURS: ${MATERIAL_DOCUMENT_RETENTION_HOURS:-24}
      MATERIAL_DOCUMENT_USER_DAILY_LIMIT: ${MATERIAL_DOCUMENT_USER_DAILY_LIMIT:-10}
      MATERIAL_DOCUMENT_USER_ACTIVE_LIMIT: ${MATERIAL_DOCUMENT_USER_ACTIVE_LIMIT:-2}
      MATERIAL_DOCUMENT_GLOBAL_DAILY_LIMIT: ${MATERIAL_DOCUMENT_GLOBAL_DAILY_LIMIT:-20}
      MATERIAL_DOCUMENT_GLOBAL_QUEUE_LIMIT: ${MATERIAL_DOCUMENT_GLOBAL_QUEUE_LIMIT:-50}
      MATERIAL_DOCUMENT_RELEASE_LANE: local
      MCP_URL: ${MCP_URL:-http://mcp-server:3000/mcp}
      MCP_HEALTH_URL: ${MCP_HEALTH_URL:-http://mcp-server:3000/health}
      MOCK_GOV_API_URL: ${GOV_API_BASE_URL:-http://mock-gov-api:8080}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?Run scripts/init-env.ps1 first}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Run scripts/init-env.ps1 first}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      PII_HMAC_KEY: ${PII_HMAC_KEY:?Run scripts/init-env.ps1 first}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Run scripts/init-env.ps1 first}
      CHAT_QUOTA_EXEMPT_SUBJECT_HASHES: ${CHAT_QUOTA_EXEMPT_SUBJECT_HASHES:-[]}
      ENABLE_DEMO_PROVIDERS: ${ENABLE_DEMO_PROVIDERS:-true}
      DEMO_SMS_CODE: ${DEMO_SMS_CODE:-000000}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin.demo}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run scripts/init-env.ps1 first}
      DEMO_STAFF_USERNAME: ${DEMO_STAFF_USERNAME:-staff.demo}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:?Run scripts/init-env.ps1 first}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Run scripts/init-env.ps1 first}
      LLM_MODE: ${LLM_MODE:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      VISION_ENABLED: ${VISION_ENABLED:-true}
      VISION_PROVIDER: ${VISION_PROVIDER:-mock}
      VISION_DASHSCOPE_API_KEY: ${VISION_DASHSCOPE_API_KEY:-}
      VISION_DASHSCOPE_BASE_URL: ${VISION_DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      VISION_FAST_PROVIDER: ${VISION_FAST_PROVIDER:-mock}
      VISION_FAST_HTTP_URL: ${VISION_FAST_HTTP_URL:-}
      VISION_FAST_TIMEOUT_SECONDS: ${VISION_FAST_TIMEOUT_SECONDS:-0.5}
      VISION_FAST_MAX_CONCURRENCY: ${VISION_FAST_MAX_CONCURRENCY:-2}
      VISION_TIMELINE_TTL_SECONDS: ${VISION_TIMELINE_TTL_SECONDS:-120}
      VISION_TIMELINE_MAX_EVENTS: ${VISION_TIMELINE_MAX_EVENTS:-128}
      VISION_SEALED_TURN_CAPACITY: ${VISION_SEALED_TURN_CAPACITY:-2}
      VISION_LATE_MEMORY_TTL_SECONDS: ${VISION_LATE_MEMORY_TTL_SECONDS:-120}
      VISION_TURN_CLOSE_WAIT_MS: ${VISION_TURN_CLOSE_WAIT_MS:-2000}
      VISION_ANALYSIS_GLOBAL_DAILY: ${VISION_ANALYSIS_GLOBAL_DAILY:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped

  material-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.material-worker
    environment:
      ENVIRONMENT: local
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1 first}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
      MATERIALS_BUCKET: ${MATERIALS_BUCKET:-smart-gov-materials}
      KNOWLEDGE_BUCKET: ${KNOWLEDGE_BUCKET:-smart-gov-knowledge}
      MATERIAL_TEMPLATE_SOURCE_PREFIX: ${MATERIAL_TEMPLATE_SOURCE_PREFIX:-material-templates/v1}
      MATERIAL_TEMPLATE_MANIFEST_PATH: ${MATERIAL_TEMPLATE_MANIFEST_PATH:-resources/material_templates/v1/manifest.json}
      MATERIAL_TEMPLATES_BUCKET: ${MATERIAL_TEMPLATES_BUCKET:-smart-gov-material-templates}
      GENERATED_DOCUMENTS_BUCKET: ${GENERATED_DOCUMENTS_BUCKET:-smart-gov-generated-documents}
      MATERIAL_DOCUMENTS_ENABLED: ${MATERIAL_DOCUMENTS_ENABLED:-true}
      MATERIAL_TEMPLATE_PROVIDER: ${MATERIAL_TEMPLATE_PROVIDER:-mock}
      MATERIAL_TEMPLATE_MODEL: ${MATERIAL_TEMPLATE_MODEL:-qwen3-vl-flash-2026-01-22}
      MATERIAL_TEMPLATE_DASHSCOPE_BASE_URL: ${MATERIAL_TEMPLATE_DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MATERIAL_TEMPLATE_DASHSCOPE_API_KEY: ${MATERIAL_TEMPLATE_DASHSCOPE_API_KEY:-}
      MATERIAL_DOCUMENT_RETENTION_HOURS: ${MATERIAL_DOCUMENT_RETENTION_HOURS:-24}
      MATERIAL_DOCUMENT_WORKER_POLL_SECONDS: ${MATERIAL_DOCUMENT_WORKER_POLL_SECONDS:-1.0}
      MATERIAL_DOCUMENT_WORKER_LEASE_SECONDS: ${MATERIAL_DOCUMENT_WORKER_LEASE_SECONDS:-180}
      MATERIAL_DOCUMENT_MODEL_TIMEOUT_SECONDS: ${MATERIAL_DOCUMENT_MODEL_TIMEOUT_SECONDS:-90}
      MATERIAL_DOCUMENT_RELEASE_LANE: local
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/material-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 30 else 1)"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
